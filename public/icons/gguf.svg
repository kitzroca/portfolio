<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
    <rect width="48" height="48" rx="10" fill="#181D28"/>
    <!-- Isometric 3D Quantized Model Tensor Cube -->
    <!-- Top Face -->
    <polygon points="24,9 37,16.5 24,24 11,16.5" fill="#F59E0B" stroke="#FDE68A" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="11,16.5 24,24 24,39 11,31.5" fill="#D97706" stroke="#FDE68A" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="37,16.5 24,24 24,39 37,31.5" fill="#B45309" stroke="#FDE68A" stroke-width="1.5"/>
    <!-- Quantization Lattice Grid Lines -->
    <line x1="17.5" y1="20.25" x2="30.5" y2="12.75" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="17.5" y1="35.25" x2="17.5" y2="20.25" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="30.5" y1="35.25" x2="30.5" y2="20.25" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"/>
  </svg>